plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.draftly'
version = '0.0.1-SNAPSHOT'
description = 'Draftly - Academic Research Assistance Platform'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.0-M2")
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Spring AI
	implementation 'org.springframework.ai:spring-ai-pdf-document-reader'

	// NLP - OpenNLP
	implementation 'org.apache.opennlp:opennlp-tools:2.4.0'

	// Similarity / Text Analysis
	implementation 'org.apache.commons:commons-text:1.12.0'
	implementation 'org.apache.commons:commons-math3:3.6.1'

	// PDF Export - iText
	implementation 'com.itextpdf:itext-core:9.1.0'

	// Word Export - Apache POI
	implementation 'org.apache.poi:poi-ooxml:5.3.0'

	// Lombok (optional but useful)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
